databases:
  - name: zero-trust-db
    databaseName: cn_dang_nhap
    user: zero_trust_user
    region: singapore
    plan: free

services:
  - type: web
    name: thpt-hoang-van-thu-zero-trust
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: zero-trust-db
          property: connectionString
      - key: OTP_MASTER_KEY_HEX
        value: 486f616e6756616e5468755f5a65726f54727573745f4d617374657232303236
      - key: IDLE_TIMEOUT_MINUTES
        value: "5"
      - key: INITIAL_ADMIN_PASSWORD
        value: Admin@2026!
